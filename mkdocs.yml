# このファイルは追跡対象（git 管理下）。分析対象の情報を書き込まないこと。
#
# nav はここには書かない。
# nav には分析対象のプロジェクト名・機能名・ファイルパスが並ぶため、
# 追跡ファイルに書き込むと実行のたびに機密情報が git に混入する。
# nav は scripts/generate_nav.py が mkdocs.generated.yml（gitignore 対象）へ
# 出力し、そのファイルが INHERIT でこの設定を取り込む。
#
#   python3 scripts/generate_nav.py
#   mkdocs build -f mkdocs.generated.yml
#
# mkdocs.generated.yml が無い状態でも mkdocs build は動作する
# （その場合 nav は docs/ のファイル構成から自動生成される）。

site_name: "knowledge-asset-tool Documentation"
site_description: "knowledge-asset-tool で自動生成されたドキュメントサイト"
docs_dir: docs
use_directory_urls: false
theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切替
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切替
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css



plugins:
  - search:
      lang: ja
      separator: '[\s\-\.]+'

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
